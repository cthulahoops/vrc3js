<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121b1b" />
    <title>VRC3D — Three.js prototype</title>
    <!-- Vite injects CSS from JS in dev; keep hidden overlays from flashing. -->
    <style>
      .hidden {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="world" aria-label="Interactive 3D spatial office"></canvas>
      <header class="topbar">
        <a
          class="brand"
          href="https://github.com/cthulahoops/vrc3d"
          target="_blank"
          rel="noreferrer"
        >
          <span class="brand-mark">V</span>
          <span><strong>VRC3D</strong><small>THREE.JS PROTOTYPE</small></span>
        </a>
        <div class="status" id="connection-status">
          <i></i><span class="status-label">Connecting to world</span>
        </div>
      </header>
      <div class="reticle" aria-hidden="true"></div>
      <section
        id="login"
        class="gate"
        aria-labelledby="login-title"
        aria-describedby="login-copy auth-status"
      >
        <div class="gate-card">
          <h1 id="login-title">Welcome to Virtual RC Three.JS.</h1>
          <a id="login-link" class="primary-action" href="/auth/login" hidden
            >Login</a
          >
          <p id="auth-status" class="auth-status" aria-live="polite"></p>
        </div>
      </section>
      <section id="welcome" class="welcome hidden">
        <button id="enter">Enter Virtual RC <span>↗</span></button>
        <div class="controls">
          <span><kbd>WASD</kbd> move</span><span><kbd>MOUSE</kbd> look</span
          ><span><kbd>ESC</kbd> release</span>
        </div>
      </section>
      <footer class="hint" id="hint">
        Click anywhere to look around · WASD to move
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
